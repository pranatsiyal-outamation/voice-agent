name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          RAW_SCRIPT=$(cat << 'EOF'
          set -e
          export HOME=/root
          echo "Current user: $(whoami)"

          # tell git it's safe to operate on this directory as root
          git config --global --add safe.directory /home/pranat.siyal/voice-agent

          # pull latest code (reset --hard discards any local changes)
          git -C /home/pranat.siyal/voice-agent fetch origin main
          git -C /home/pranat.siyal/voice-agent reset --hard origin/main

          # fix ownership so your user can still edit files locally
          chown -R pranat.siyal:pranat.siyal /home/pranat.siyal/voice-agent/

          echo "Deploy done."
          EOF
          )

          B64_SCRIPT=$(echo "$RAW_SCRIPT" | base64 -w 0)

          echo "Sending command to SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d85aa0914d810c66" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"echo $B64_SCRIPT | base64 -d > /tmp/deploy.sh && bash /tmp/deploy.sh\"]}" \
            --query "Command.CommandId" --output text)

          echo "Command ID: $COMMAND_ID"

          # poll until command finishes
          STATUS="Pending"
          while [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" ]]; do
            sleep 7
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0d85aa0914d810c66" \
              --query "CommandInvocations[0].Status" --output text)
            echo "Status: $STATUS"
          done

          # fetch full output
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d85aa0914d810c66" \
            --output json)

          echo "--- STDOUT ---"
          echo $RESULT | jq -r '.StandardOutputContent'
          echo "--- STDERR ---"
          echo $RESULT | jq -r '.StandardErrorContent'

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment Failed."
            exit 1
          fi

          echo "✅ Deployment Successful!"